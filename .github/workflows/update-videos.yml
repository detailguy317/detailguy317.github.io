# DG317 video robot: catches LIVE racing on YouTube every 30 minutes, day or night.
# Needs repo secret YOUTUBE_API_KEY (Settings -> Secrets and variables -> Actions).
# Uses about 5,000 of the free 10,000 daily YouTube units (see scripts/update_videos.py).
name: update-videos
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: dg317-data, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/update_videos.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Commit if anything changed
        run: |
          git config user.name "dg317-robot"
          git config user.email "dg317-robot@users.noreply.github.com"
          git add data/racing-auto.js data/yt-channel-ids.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "robot: race videos"
          git pull --rebase -q && git push
