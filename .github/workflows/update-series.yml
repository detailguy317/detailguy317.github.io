# DG317 series robot: Racing HQ standings (Wikipedia) + headlines (Google News) for every series + the Race Center schedule.
# No keys needed. Times are UTC.
name: update-series
on:
  schedule:
    - cron: "37 */3 * * 1-4"     # Mon-Thu every 3 hours
    - cron: "37 */2 * * 5,6,0"   # Fri-Sun every 2 hours (race weekends)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: dg317-data, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/update_series.py
      - name: Race schedule (F1, NASCAR, Wikipedia calendars)
        run: python scripts/update_schedule.py || true
      - name: Commit if anything changed
        run: |
          git config user.name "dg317-robot"
          git config user.email "dg317-robot@users.noreply.github.com"
          git add data/series-live.js data/schedule-auto.js
          git diff --cached --quiet || git commit -m "robot: refresh series standings + news"
          git pull --rebase -q && git push
